<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentToolNest - 50 Fully Working Tools</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }

    [data-theme="dark"] {
      --primary: #6366f1;
      --primary-hover: #818cf8;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; transition: all 0.3s ease; }
    .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 1rem; }

    header { background: var(--card-bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
    .header-in { display: flex; align-items: center; justify-content: space-between; height: 65px; }
    .logo { font-size: 1.3rem; font-weight: 800; color: var(--primary); text-decoration: none; cursor: pointer; }
    .theme-btn { background: none; border: 1px solid var(--border); color: var(--text); width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 1.1rem; }

    .hero { text-align: center; padding: 2.5rem 1rem 1.5rem; background: linear-gradient(180deg, rgba(79,70,229,0.08) 0%, rgba(0,0,0,0) 100%); }
    .hero h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
    .hero p { color: var(--text-muted); margin-bottom: 1.5rem; }

    .search-box { max-width: 550px; margin: 0 auto 1.5rem; position: relative; }
    .search-box input { width: 100%; padding: 0.85rem 1rem 0.85rem 2.5rem; border: 2px solid var(--border); border-radius: var(--radius); background: var(--card-bg); color: var(--text); outline: none; font-size: 1rem; }
    .search-box input:focus { border-color: var(--primary); }
    .search-icon { position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

    .pills { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.75rem; margin-bottom: 1.5rem; }
    .pill { padding: 0.4rem 1rem; border-radius: 20px; background: var(--card-bg); border: 1px solid var(--border); color: var(--text); cursor: pointer; white-space: nowrap; font-size: 0.88rem; font-weight: 500; }
    .pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    #workspace { display: none; background: var(--card-bg); border: 2px solid var(--primary); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 2rem; box-shadow: var(--shadow); position: relative; }
    .close-ws { position: absolute; right: 1rem; top: 1rem; background: none; border: none; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; margin-bottom: 3rem; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; }
    .card:hover { transform: translateY(-3px); border-color: var(--primary); box-shadow: var(--shadow); }
    .card-head { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
    .icon { width: 36px; height: 36px; border-radius: 8px; background: rgba(79,70,229,0.1); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .title { font-weight: 600; font-size: 0.95rem; }
    .desc { font-size: 0.8rem; color: var(--text-muted); flex-grow: 1; }

    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem; }
    .form-control { width: 100%; padding: 0.6rem 0.8rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); outline: none; font-size: 0.95rem; }
    .form-control:focus { border-color: var(--primary); }
    textarea.form-control { min-height: 100px; resize: vertical; font-family: monospace; }
    .btn { padding: 0.6rem 1.2rem; border-radius: 6px; border: none; background: var(--primary); color: #fff; font-weight: 600; cursor: pointer; font-size: 0.9rem; margin-right: 0.5rem; margin-top: 0.5rem; }
    .btn:hover { background: var(--primary-hover); }
    .btn-sec { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
    .out-box { margin-top: 1rem; padding: 1rem; background: var(--bg); border: 1px dashed var(--border); border-radius: 6px; font-weight: 600; white-space: pre-wrap; word-break: break-all; }

    footer { background: var(--card-bg); border-top: 1px solid var(--border); padding: 1.5rem 0; text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: auto; }
  </style>
</head>
<body>

  <header>
    <div class="container header-in">
      <div class="logo" onclick="closeWorkspace()">🎓 StudentToolNest (100% Real Working)</div>
      <button class="theme-btn" id="themeToggle" onclick="toggleTheme()">🌙</button>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>50 Genuine Student & Academic Tools</h1>
      <p>Instant client-side output — 100% private, fast, and fully working.</p>
      
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search any tool (e.g. GPA, Percentage, Age, Base64, Interest)..." oninput="renderGrid()">
      </div>
    </div>
  </section>

  <main class="container">
    <div id="workspace">
      <button class="close-ws" onclick="closeWorkspace()">✕</button>
      <div id="wsContent"></div>
    </div>

    <div class="pills">
      <button class="pill active" onclick="filterCat('all', this)">All (50)</button>
      <button class="pill" onclick="filterCat('calc', this)">Math & Calc</button>
      <button class="pill" onclick="filterCat('study', this)">Study & Notes</button>
      <button class="pill" onclick="filterCat('text', this)">Text Utilities</button>
      <button class="pill" onclick="filterCat('unit', this)">Unit Converters</button>
      <button class="pill" onclick="filterCat('finance', this)">Finance & Money</button>
      <button class="pill" onclick="filterCat('dev', this)">Developer & Code</button>
    </div>

    <div class="grid" id="toolsGrid"></div>
  </main>

  <footer>
    © 2026 StudentToolNest. 100% Working Client-Side Student Tools.
  </footer>

  <script>
    const TOOLS = [
      // Calc (1-10)
      { id: "gpa-calc", name: "GPA Calculator", cat: "calc", icon: "🎓", desc: "Calculate grade point average from credits." },
      { id: "percentage-calc", name: "Percentage Calculator", cat: "calc", icon: "📊", desc: "Calculate X% of Y and percentage values." },
      { id: "target-grade", name: "Final Exam Score Needed", cat: "calc", icon: "🎯", desc: "Calculate final score needed for target grade." },
      { id: "age-calc", name: "Age & Next Birthday", cat: "calc", icon: "🎂", desc: "Calculate age in Y/M/D and days to birthday." },
      { id: "scientific-calc", name: "Scientific Math Calculator", cat: "calc", icon: "🧮", desc: "Evaluate complex Math expressions." },
      { id: "fraction-calc", name: "Fraction Math Calculator", cat: "calc", icon: "➗", desc: "Add, subtract, multiply, divide fractions." },
      { id: "stats-calc", name: "Mean, Median & Mode", cat: "calc", icon: "📈", desc: "Calculate average and median of numbers." },
      { id: "ratio-calc", name: "Ratio Simplifier", cat: "calc", icon: "⚖️", desc: "Simplify ratios like A:B to lowest terms." },
      { id: "discount-calc", name: "Discount Calculator", cat: "calc", icon: "🏷️", desc: "Calculate sale price after percentage discount." },
      { id: "tip-calc", name: "Bill & Tip Splitter", cat: "calc", icon: "🍕", desc: "Split bills and tips equally between friends." },

      // Study (11-20)
      { id: "pomodoro", name: "Pomodoro Study Timer", cat: "study", icon: "⏱️", desc: "25-min focus timer with pause & reset." },
      { id: "stopwatch", name: "Stopwatch & Lap Tracker", cat: "study", icon: "⌛", desc: "Track practice exam time with laps." },
      { id: "study-notes", name: "Browser Quick Notes", cat: "study", icon: "📝", desc: "Auto-saves study notes in local browser." },
      { id: "todo-list", name: "Assignment Task Planner", cat: "study", icon: "✅", desc: "Add, mark, and track homework tasks." },
      { id: "random-picker", name: "Random Name/Topic Picker", cat: "study", icon: "🎲", desc: "Pick a random line or student name." },
      { id: "lorem-gen", name: "Lorem Ipsum Generator", cat: "study", icon: "📄", desc: "Generate dummy text paragraphs." },
      { id: "reading-time", name: "Reading Time Estimator", cat: "study", icon: "📖", desc: "Estimate speech or reading duration." },
      { id: "markdown-prev", name: "Markdown Live Previewer", cat: "study", icon: "🖋️", desc: "Render markdown headers, bold & italic text." },
      { id: "qr-gen", name: "QR Code Generator", cat: "study", icon: "📱", desc: "Generate QR codes for URLs and text." },
      { id: "pdf-page-cnt", name: "Word Estimate by Pages", cat: "study", icon: "📚", desc: "Convert document pages to word estimate." },

      // Text (21-30)
      { id: "word-counter", name: "Word & Character Counter", cat: "text", icon: "🔤", desc: "Count words, chars, sentences, paras." },
      { id: "case-converter", name: "Text Case Converter", cat: "text", icon: "🔠", desc: "UPPERCASE, lowercase, Title Case." },
      { id: "space-remover", name: "Remove Extra Spaces", cat: "text", icon: "🧹", desc: "Clean up messy spacing in text." },
      { id: "text-reverser", name: "Text Reverser", cat: "text", icon: "🔄", desc: "Reverse text order or character sequence." },
      { id: "line-sorter", name: "Alphabetical Line Sorter", cat: "text", icon: "🔤", desc: "Sort reference lists A to Z." },
      { id: "duplicate-remover", name: "Remove Duplicate Lines", cat: "text", icon: "📋", desc: "Filter unique lines from text." },
      { id: "character-limit", name: "Social Limit Checker", cat: "text", icon: "📏", desc: "Check Twitter/LinkedIn char limits." },
      { id: "find-replace", name: "Find & Replace Text", cat: "text", icon: "🔍", desc: "Replace target words across assignment." },
      { id: "text-cleaner", name: "HTML Tag Stripper", cat: "text", icon: "✂️", desc: "Remove HTML tags from raw text." },
      { id: "sentence-counter", name: "Paragraph & Line Stats", cat: "text", icon: "📑", desc: "Detailed breakdown of text blocks." },

      // Unit Converters (31-38)
      { id: "len-conv", name: "Length Converter", cat: "unit", icon: "📏", desc: "Convert Meters, KM, Miles, Feet, Inches." },
      { id: "weight-conv", name: "Weight Converter", cat: "unit", icon: "⚖️", desc: "Convert KG, Grams, Pounds, Ounces." },
      { id: "temp-conv", name: "Temperature Converter", cat: "unit", icon: "🌡️", desc: "Convert Celsius, Fahrenheit, Kelvin." },
      { id: "data-conv", name: "Data Storage Converter", cat: "unit", icon: "💾", desc: "Convert Bytes, KB, MB, GB, TB." },
      { id: "time-conv", name: "Time Converter", cat: "unit", icon: "⏰", desc: "Convert Seconds, Mins, Hours, Days." },
      { id: "speed-conv", name: "Speed Converter", cat: "unit", icon: "🚀", desc: "Convert Km/h, Mph, Meters/sec." },
      { id: "area-conv", name: "Area Converter", cat: "unit", icon: "📐", desc: "Convert Sq Meters, Sq Feet, Acres." },
      { id: "number-base", name: "Binary/Hex Base Converter", cat: "unit", icon: "🔢", desc: "Convert Decimal, Binary, Hexadecimal." },

      // Finance (39-44)
      { id: "simple-interest", name: "Simple Interest Calc", cat: "finance", icon: "💰", desc: "Calculate simple interest on principal." },
      { id: "compound-interest", name: "Compound Interest Calc", cat: "finance", icon: "📈", desc: "Calculate compounding growth." },
      { id: "emi-calc", name: "Loan EMI Calculator", cat: "finance", icon: "🏦", desc: "Calculate monthly EMI and total interest." },
      { id: "gst-calc", name: "GST / Tax Calculator", cat: "finance", icon: "🧾", desc: "Add or remove GST tax percentage." },
      { id: "salary-calc", name: "Hourly Pay to Monthly", cat: "finance", icon: "💼", desc: "Convert part-time hourly rate to monthly." },
      { id: "budget-calc", name: "Daily Pocket Budget", cat: "finance", icon: "👛", desc: "Divide allowance into safe daily limit." },

      // Developer & Security (45-50)
      { id: "pwd-gen", name: "Strong Password Generator", cat: "dev", icon: "🔐", desc: "Generate random high-entropy passwords." },
      { id: "pwd-strength", name: "Password Strength Tester", cat: "dev", icon: "🛡️", desc: "Check score and entropy of password." },
      { id: "json-format", name: "JSON Formatter & Validator", cat: "dev", icon: "💻", desc: "Beautify or minify JSON string." },
      { id: "base64-tool", name: "Base64 Encoder / Decoder", cat: "dev", icon: "🔤", desc: "Encode or decode Base64 strings." },
      { id: "url-tool", name: "URL Encoder / Decoder", cat: "dev", icon: "🔗", desc: "Format URLs for web links." },
      { id: "img-compress", name: "Client Image Compressor", cat: "dev", icon: "🖼️", desc: "Compress JPEG/PNG image locally." }
    ];

    let currentCat = 'all';

    document.addEventListener("DOMContentLoaded", () => {
      renderGrid();
      initTheme();
    });

    function toggleTheme() {
      const isDark = document.documentElement.getAttribute("data-theme") === "dark";
      document.documentElement.setAttribute("data-theme", isDark ? "light" : "dark");
      document.getElementById("themeToggle").innerText = isDark ? "🌙" : "☀️";
    }

    function initTheme() {
      if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.setAttribute("data-theme", "dark");
        document.getElementById("themeToggle").innerText = "☀️";
      }
    }

    function filterCat(cat, btn) {
      currentCat = cat;
      document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
      if (btn) btn.classList.add("active");
      renderGrid();
    }

    function renderGrid() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      const grid = document.getElementById("toolsGrid");

      const filtered = TOOLS.filter(t => {
        const matchCat = (currentCat === 'all' || t.cat === currentCat);
        const matchQuery = t.name.toLowerCase().includes(query) || t.desc.toLowerCase().includes(query);
        return matchCat && matchQuery;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="grid-column:1/-1; color:var(--text-muted);">No tool found matching "${query}".</p>`;
        return;
      }

      grid.innerHTML = filtered.map(t => `
        <div class="card" onclick="openTool('${t.id}')">
          <div class="card-head">
            <div class="icon">${t.icon}</div>
            <div class="title">${t.name}</div>
          </div>
          <div class="desc">${t.desc}</div>
        </div>
      `).join("");
    }

    function closeWorkspace() {
      document.getElementById("workspace").style.display = "none";
    }

    /* SPECIFIC CUSTOM UI FOR EVERY SINGLE TOOL */
    function openTool(id) {
      const ws = document.getElementById("workspace");
      const content = document.getElementById("wsContent");
      ws.style.display = "block";
      ws.scrollIntoView({ behavior: 'smooth' });

      switch(id) {
        case "gpa-calc":
          content.innerHTML = `
            <h2>🎓 GPA Calculator</h2>
            <div class="form-group"><label>Grades (comma separated, e.g. 4.0, 3.7, 3.3, 3.0):</label><input type="text" id="g-in" class="form-control" value="4.0, 3.7, 3.3, 3.0"></div>
            <div class="form-group"><label>Credits (comma separated, e.g. 3, 4, 3, 2):</label><input type="text" id="c-in" class="form-control" value="3, 4, 3, 2"></div>
            <button class="btn" onclick="execGPA()">Calculate GPA</button>
            <div id="out" class="out-box" style="display:none;"></div>`;
          break;

        case "percentage-calc":
          content.innerHTML = `
            <h2>📊 Percentage Calculator</h2>
            <div class="form-group"><label>What is <input type="number" id="p1" style="width:80px;" value="15"> % of <input type="number" id="p2" style="width:100px;" value="500"> ?</label></div>
            <button class="btn" onclick="execPerc()">Calculate Percentage</button>
            <div id="out" class="out-box" style="display:none;"></div>`;
          break;

        case "target-grade":
          content.innerHTML = `
            <h2>🎯 Final Exam Score Needed Calculator</h2>
            <div class="form-group"><label>Current Grade (%):</label><input type="number" id="tg-curr" class="form-control" value="82"></div>
            <div class="form-group"><label>Target Grade (%):</label><input type="number" id="tg-target" class="form-control" value="90"></div>
            <div class="form-group"><label>Final Exam Weight (%):</label><input type="number" id="tg-weight" class="form-control" value="30"></div>
            <button class="btn" onclick="execTargetGrade()">Calculate Final Score Needed</button>
            <div id="out" class="out-box" style="display:none;"></div>`;
          break;

        case "age-calc":
          content.innerHTML = `
            <h2>🎂 Age Calculator</h2>
            <div class="form-group"><label>Date of Birth:</label><input type="date" id="dob" class="form-control"></div>
            <button class="btn" onclick="execAge()">Calculate Age</button>
            <div id="out" class="out-box" style="display:none;"></div>`;
          break;

        case "scientific-calc":
          content.innerHTML = `
            <h2>🧮 Scientific Expression Calculator</h2>
            <div class="form-group"><label>Expression (e.g. Math.sin(Math.PI/2) + Math.sqrt(144) + Math.pow(2,4)):</label><input type="text" id="sci-in" class="form-control" value="Math.sqrt(144) + Math.pow(2,4)"></div>
            <button class="btn" onclick="execSci()">Evaluate</button>
            <div id="out" class="out-box" style="display:none;"></div>`;
          break;

        case "fraction-calc":
          content.innerHTML = `
            <h2>➗ Fraction Calculator</h2>
            <div class="form-group">
              <input type="number" id="n1" style="width:60px;" value="1"> / <input type="number" id="d1" style="width:60px;" value="2">
              <select id="f-op" style="padding:0.4rem;"><option>+</option><option>-</option><option>*</option><option>/</option></select>
              <input type="number" id="n2" style="width:60px;" value="1"> / <input type="number" id="d2" style="width:60px;" value="3">
            </div>
            <button class="btn" onclick="execFraction()">Calculate Fraction</button>
            <div id="out" class="out-box" style="display:none;"></div>`;
          break;

        case "stats-calc":
          content.innerHTML = `
            <h2>📈 Mean, Median & Mode Calculator</h2>
            <div class="form-group"><label>Numbers (comma separated):</label><input type="text" id="st-in" class="form-control" value="12, 15, 22, 15, 30, 45, 12, 15"></div>
            <button class="btn" onclick="execStats()">Calculate Statistics</button>
            <div id="out" class="out-box" style="display:none;"></div>`;
          break;

        case "ratio-calc":
          content.innerHTML = `
            <h2>⚖️ Ratio Simplifier</h2>
            <div class="form-group"><label>Ratio A :
